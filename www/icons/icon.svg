<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="3" y="3" width="94" height="94" rx="21" fill="#1C4E5C"/>
             <rect x="3" y="3" width="94" height="94" rx="21" fill="none"
                   stroke="#143B46" stroke-width="1.6"/>

  <!-- edges first, so nodes sit on top -->
  <line x1="50.000" y1="24.200" x2="31.940" y2="50.000" stroke="#7FB9C9" stroke-opacity="0.85" stroke-width="2.236" stroke-linecap="round"/>
  <line x1="50.000" y1="24.200" x2="68.060" y2="50.000" stroke="#7FB9C9" stroke-opacity="0.85" stroke-width="2.236" stroke-linecap="round"/>
  <line x1="31.940" y1="50.000" x2="20.760" y2="74.940" stroke="#7FB9C9" stroke-opacity="0.5" stroke-width="2.236" stroke-linecap="round"/>
  <line x1="31.940" y1="50.000" x2="43.120" y2="74.940" stroke="#7FB9C9" stroke-opacity="0.5" stroke-width="2.236" stroke-linecap="round"/>
  <line x1="68.060" y1="50.000" x2="56.880" y2="74.940" stroke="#7FB9C9" stroke-opacity="0.5" stroke-width="2.236" stroke-linecap="round"/>
  <line x1="68.060" y1="50.000" x2="79.240" y2="74.940" stroke="#7FB9C9" stroke-opacity="0.5" stroke-width="2.236" stroke-linecap="round"/>

  <!-- the touched node -->
  <circle cx="50.000" cy="24.200" r="9.030" fill="#CFA845" />

  <!-- direct dependents -->
  <circle cx="31.940" cy="50.000" r="6.880" fill="#E9EAE3" />
  <circle cx="68.060" cy="50.000" r="6.880" fill="#E9EAE3" />

  <!-- transitive dependents -->
  <circle cx="20.760" cy="74.940" r="5.504" fill="#E9EAE3" fill-opacity="0.82"/>
  <circle cx="43.120" cy="74.940" r="5.504" fill="#E9EAE3" fill-opacity="0.82"/>
  <circle cx="56.880" cy="74.940" r="5.504" fill="#E9EAE3" fill-opacity="0.82"/>
  <circle cx="79.240" cy="74.940" r="5.504" fill="#E9EAE3" fill-opacity="0.82"/>
</svg>