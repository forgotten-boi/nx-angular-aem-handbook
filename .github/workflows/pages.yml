name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time. Do not cancel a running deploy: a
# half-applied Pages deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The affected-graph maths in chapter 2, recomputed two ways.
      - name: Verify the affected closure
        run: npm run verify:graph

      # Full Playwright pass: render, deep link, night mode, service
      # worker, offline, file://. Fails the deploy if the book is broken.
      - name: Verify the book
        run: npx playwright install --with-deps chromium && npm run verify

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # www/ is the only thing that ships.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./www

      - id: deployment
        uses: actions/deploy-pages@v5
